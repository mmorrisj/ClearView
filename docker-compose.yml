services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clearview
      POSTGRES_PASSWORD: clearview  # local development only
      POSTGRES_DB: clearview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro  # creates clearview_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearview -d clearview"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
